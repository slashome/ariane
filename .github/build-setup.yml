- name: Install pnpm
  uses: pnpm/action-setup@v4
  with:
    version: 12
- name: Install Node
  uses: actions/setup-node@v5
  with:
    node-version: 26
    cache: pnpm
    cache-dependency-path: web/pnpm-lock.yaml
- name: Build the front
  run: |
    pnpm -C web install --frozen-lockfile
    pnpm -C web build
