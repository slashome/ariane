[package]
name = "ariane"
version = "0.1.0"
edition = "2024"
description = "Ariadne's thread through your projects: a file-based, hierarchical project management method."
homepage = "https://github.com/slashome/ariane"
repository = "https://github.com/slashome/ariane"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
mime_guess = "2.0.5"
notify = "8.2.0"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.0"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
toml = "1.1.8"
toml_edit = "0.25.17"
ureq = { version = "3.5.0", features = ["json"] }
yaml_serde = "0.10.7"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

# The profile that cargo-dist builds release artifacts with.
[profile.dist]
inherits = "release"
lto = "thin"
