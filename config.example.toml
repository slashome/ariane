# Ariane configuration (ADR-0013).
# Generated from the schema compiled into `ariane`: `ariane config example`.

# Schema version of this file. Changed only by `ariane migrate`.
version = 1

# The content repository, used when the current directory leads to none.
# repo = "~/path/to/_ariane"

[server]
# Port `ariane serve` listens on, on 127.0.0.1 only. `--port` overrides it.
port = 27317

# Name under which the front door serves the interface (`ariane proxy setup` declares it).
host = "ariane.local"

[proxy]
# Port of the front door, on 127.0.0.1, where port 80 of 127.0.0.2 is redirected.
port = 27380
